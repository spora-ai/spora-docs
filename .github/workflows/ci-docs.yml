name: CI

# External actions are pinned to full commit SHAs to prevent supply-chain
# attacks via tag reassignment. Run `gh api repos/OWNER/REPO/git/ref/tags/vN`
# to look up the current SHA when upgrading. Review SonarCloud hotspots
# (rule githubactions:S7637) periodically.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Permissions default to read-only at the workflow level, so every job runs
# with the minimum token it needs (rule S8233). Nothing in this workflow
# writes to the repository — it reads, checks out and builds.
#
# Every checkout sets `persist-credentials: false`, which keeps the job
# token out of the checkout's .git/config. The workflow runs code from the
# pull request in every job, and the api-spec job additionally runs
# `composer install` and `php bin/spora-build` from the core ref the pull
# request names — a token left on disk would be readable by that code.
# Nothing here pushes or fetches with the credential afterwards.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The API reference renderer. It has no spec to read here — the spec is a
    # CI artifact of the `api-spec` job and is absent from a fresh checkout —
    # so the tests run against a fixture and the job needs no sibling repo.
    name: Renderer tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

  lint-md:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci --ignore-scripts

      - name: Markdown lint
        run: npm run lint:md

  prettier:
    name: Prettier check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci --ignore-scripts

      - name: Prettier check
        run: npm run format:check

  lint-schemas:
    # Fails the build when a *mirrored* schema in
    # docs/.vuepress/public/schemas/ drifts from spora-core — currently
    # agent-template.schema.json. plugin.schema.json is deliberately NOT
    # mirrored: it is owned by this repo because spora-core's copy was wrong at
    # the root, and it is covered by the `lint-plugin-schema` job below. The
    # script mirrors the sibling-checkout pattern used by `api-spec` and
    # `build` — checks out spora-core into ./spora-core, then runs
    # sync:schemas.mjs in --check mode. Mirrors are regenerated by `prebuild` /
    # `predev` locally, so a drift means someone forgot to run
    # `npm run sync:schemas` after editing a schema on the spora-core side.
    #
    # The mirror is a byte-for-byte copy of the core's file, so it is compared
    # against the core ref the docs repo declares — the same ref the API
    # reference is generated from, in docs/.vuepress/core-api-ref. A docs PR
    # that documents an unmerged core PR therefore carries the mirror that
    # core PR produces. With no declared ref, the comparison is against main.
    name: Schema mirror drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Read the declared core ref
        id: core-ref
        run: |
          ref=""
          if [ -f docs/.vuepress/core-api-ref ]; then
            ref=$(awk '/^[[:space:]]*#/ { next } NF { gsub(/[[:space:]]/, "", $0); print; exit }' docs/.vuepress/core-api-ref || true)
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Declared core ref: ${ref:-none}"

      - name: Checkout spora-core
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          repository: spora-ai/spora-core
          ref: ${{ steps.core-ref.outputs.ref || 'main' }}
          path: spora-core

      - name: Install
        run: npm ci --ignore-scripts

      - name: sync:schemas:check
        run: npm run sync:schemas:check

  lint-plugin-schema:
    # Validates the *published* plugin.json schema against the manifests that
    # actually exist. `lint-schemas` above cannot do this: it only checks that
    # the public copy matches its spora-core source, so a source that is wrong
    # at the root passes forever. The schema shipped `additionalProperties:
    # false` over five keys while every shipped manifest also carried
    # `$schema`, `name`, and sometimes `autoload` — every editor flagged every
    # valid plugin, and no existing check noticed.
    #
    # Scope — read this before trusting a green run: CI checks out spora-core
    # and the plugin repos it names, so this validates spora-core's committed
    # manifest fixtures (tests/Fixtures/**) and the *shipped* manifests of the
    # checked-out plugins — but NOT the ~20 shipped plugin repos, which are
    # only visible in a local sibling-checkout layout. The fixtures exercise
    # the full key surface ($schema, accent, autoload, class, description,
    # icon, name, slug), so the check is meaningful here rather than
    # vacuous — and the script prints the manifest count and source, and
    # fails outright on zero, so that claim is auditable from this job's log
    # and cannot silently decay into a no-op.
    #
    # spora-plugin-usage is checked out so the icon contract is asserted
    # against a manifest that actually ships, not only against a fixture.
    # A shipped manifest is what a plugin author copies, and the check has
    # already earned its place here: it caught a shipped manifest naming an
    # icon the host does not bundle — a manifest the schema accepted and the
    # loader validated, so the tile would have rendered as the "puzzle"
    # fallback with nothing saying why.
    #
    # A separate job rather than a step inside `lint-schemas` on purpose: the
    # two guard different failure modes and have different fixes (re-run
    # `npm run sync:schemas` vs. the schema no longer describing reality), and
    # a red job should name which one broke.
    #
    # spora-components is checked out so the icon contract can be asserted
    # against the resolver that actually implements it (Icon.vue's
    # SVG_PATH_LEAD) rather than against a second copy of the path-command
    # letters held in this repo's check — a hardcoded list would simply become
    # the next thing to drift, which is the failure mode this job exists to
    # prevent.
    name: Plugin manifest schema check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Checkout spora-core
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          repository: spora-ai/spora-core
          ref: main
          path: spora-core

      - name: Checkout spora-components
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          repository: spora-ai/spora-components
          ref: main
          path: spora-components

      - name: Checkout spora-plugin-usage
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: spora-ai/spora-plugin-usage
          ref: main
          path: spora-plugin-usage

      - name: Install
        run: npm ci --ignore-scripts

      - name: check:plugin-schema
        run: npm run check:plugin-schema

  api-spec:
    name: Generate OpenAPI spec from spora-core
    outputs:
      # The spora-core ref the docs repo declares, empty when it declares none.
      core-ref: ${{ steps.core-ref.outputs.ref }}
    runs-on: ubuntu-latest
    steps:
      # spora-core is a sibling repo under the spora-ai GitHub org. Check it out
      # into ./spora-core so the rest of the job can run its PHP tooling against
      # the latest main.
      # Checkout spora-docs itself so $GITHUB_WORKSPACE resolves to this repo
      # and docs/.vuepress/ exists on disk for the write target. Without this
      # the inner spora-core checkout leaves the spora-docs workspace empty
      # and the spec generator's file_put_contents fails.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Checkout spora-core
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          repository: spora-ai/spora-core
          ref: main
          path: spora-core

      # The docs repo declares the spora-core ref its API reference was
      # generated from — docs/.vuepress/core-api-ref. A docs PR that documents
      # an unmerged core PR names that core PR's branch there, and the drift
      # check then accepts the committed reference against either spora-core@main
      # or that ref. No file, or an empty one, means main only.
      - name: Read the declared core ref
        id: core-ref
        run: |
          ref=""
          if [ -f docs/.vuepress/core-api-ref ]; then
            ref=$(awk '/^[[:space:]]*#/ { next } NF { gsub(/[[:space:]]/, "", $0); print; exit }' docs/.vuepress/core-api-ref || true)
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Declared core ref: ${ref:-none}"

      # Both repos are public within the spora-ai org, so the default
      # GITHUB_TOKEN has read access. If spora-core ever moves behind a private
      # visibility, swap in `token: ${{ secrets.CROSS_REPO_READ_TOKEN }}`
      # below — a PAT with `contents:read` on spora-ai/spora-core.
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, zip
          coverage: none

      - name: Composer install (spora-core)
        working-directory: spora-core
        run: composer install --no-interaction --prefer-dist

      # Bypasses bin/spora (and therefore the Kernel/DI/secret-key boot) so a
      # clean checkout with no storage/secret.key can still emit the spec.
      # `bin/spora-build` is spora-core's build-time companion to `bin/spora`
      # — a Symfony Console subcommand entry that skips the kernel boot.
      - name: Generate openapi.json
        working-directory: spora-core
        run: php bin/spora-build openapi:generate "$GITHUB_WORKSPACE/docs/.vuepress/openapi.json"

      - name: Upload spec artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: openapi-spec
          path: docs/.vuepress/openapi.json
          if-no-files-found: error
          retention-days: 7

      # The second spec: the one the declared core ref generates. It is a
      # separate checkout with its own composer install — the lock file may
      # differ between the two revisions, and the spec generator must run
      # against the code it belongs to. One vendor/ across two checkouts
      # would generate the wrong spec.
      #
      # A ref that cannot be fetched must never fail the job: the branch may
      # be gone (a merged core PR's branch is deleted) and a sha may be
      # unreachable. The check then compares against main only, exactly as it
      # did before the file existed.
      - name: Checkout the declared core ref
        id: core-ref-checkout
        if: steps.core-ref.outputs.ref != ''
        continue-on-error: true
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          repository: spora-ai/spora-core
          ref: ${{ steps.core-ref.outputs.ref }}
          path: spora-core-ref
          clean: false

      - name: Composer install (declared core ref)
        if: steps.core-ref-checkout.outcome == 'success'
        continue-on-error: true
        working-directory: spora-core-ref
        run: composer install --no-interaction --prefer-dist

      - name: Generate openapi.json for the declared core ref
        id: core-ref-spec
        if: steps.core-ref-checkout.outcome == 'success'
        continue-on-error: true
        working-directory: spora-core-ref
        run: |
          php bin/spora-build openapi:generate "$GITHUB_WORKSPACE/docs/.vuepress/openapi-ref.json"
          echo "produced=true" >> "$GITHUB_OUTPUT"

      - name: Upload the declared-ref spec artifact
        if: steps.core-ref-spec.outcome == 'success' && steps.core-ref-spec.outputs.produced == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: openapi-spec-core-ref
          path: docs/.vuepress/openapi-ref.json
          if-no-files-found: error
          retention-days: 7

      - name: Report the declared core ref
        env:
          CORE_REF: ${{ steps.core-ref.outputs.ref }}
          CORE_REF_SPEC_OUTCOME: ${{ steps.core-ref-spec.outcome }}
        run: |
          if [ -z "$CORE_REF" ]; then
            echo "No core ref is declared — the API drift check compares against spora-core@main only."
          elif [ "$CORE_REF_SPEC_OUTCOME" != "success" ]; then
            echo "::notice::The declared core ref '$CORE_REF' could not be built — the API drift check compares against spora-core@main only."
          else
            echo "Declared core ref '$CORE_REF' — the API drift check also compares against it."
          fi

  api-md-drift:
    name: API reference drift check
    needs: api-spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci --ignore-scripts

      - name: Download generated spec
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: openapi-spec
          # Extract the artifact into the parent directory; actions/download-artifact
          # treats `path:` as a directory, so the file lands at openapi.json
          # inside it. Pointing `path:` at the file itself causes EISDIR
          # downstream when gen-api.mjs reads the spec.
          path: docs/.vuepress/

      # The second spec, the one the declared core ref generates. It is
      # optional: the artifact is absent when the ref could not be fetched,
      # and the check then compares against main only.
      - name: Download the declared-ref spec
        id: core-ref-spec
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: openapi-spec-core-ref
          path: docs/.vuepress/

      # Fails the build when docs/reference/api.md is out of date with the
      # just-regenerated spec. Same semantics as the previous locally-vendored
      # copy. The second attempt below compares the same reference against
      # the declared core ref, so a docs PR that documents an unmerged core PR
      # passes without the check losing its grip on main.
      - name: gen:api:check
        id: main-check
        continue-on-error: true
        run: npm run gen:api:check

      - name: gen:api:check against the declared core ref
        id: core-ref-check
        if: steps.main-check.outcome == 'failure' && steps.core-ref-spec.outcome == 'success'
        continue-on-error: true
        run: npm run gen:api:check -- --spec docs/.vuepress/openapi-ref.json

      - name: Report the drift check
        env:
          CORE_REF: ${{ needs.api-spec.outputs.core-ref }}
          MAIN_OUTCOME: ${{ steps.main-check.outcome }}
          CORE_REF_CHECK: ${{ steps.core-ref-check.outcome }}
          CORE_REF_SPEC: ${{ steps.core-ref-spec.outcome }}
        run: |
          if [ "$MAIN_OUTCOME" = "success" ]; then
            echo "The API reference matches spora-core@main."
            exit 0
          fi
          if [ "$CORE_REF_SPEC" = "success" ] && [ "$CORE_REF_CHECK" = "success" ]; then
            echo "::notice::The API reference matches the declared core ref '$CORE_REF'; spora-core@main does not carry it yet."
            exit 0
          fi
          echo "::error::The API reference is out of date against every spec it was compared against."
          if [ "$CORE_REF_SPEC" = "success" ]; then
            echo "::error::It was compared against spora-core@main (docs/.vuepress/openapi.json) and against the declared core ref '$CORE_REF' (docs/.vuepress/openapi-ref.json), and matched neither."
          else
            echo "::error::It was compared against spora-core@main (docs/.vuepress/openapi.json) only — no spec for the declared core ref was available."
          fi
          exit 1

  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

  build:
    name: Build site
    needs: api-spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci --ignore-scripts

      - name: Download generated spec
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: openapi-spec
          # Extract the artifact into the parent directory; actions/download-artifact
          # treats `path:` as a directory, so the file lands at openapi.json
          # inside it. Pointing `path:` at the file itself causes EISDIR
          # downstream when gen-api.mjs reads the spec.
          path: docs/.vuepress/

      # Render the page from the freshly-generated spec before VuePress builds,
      # so the published api.md reflects the current spora-core route surface.
      - name: gen:api
        run: npm run gen:api

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: docs-build
          path: docs/.vuepress/dist
          if-no-files-found: error
          retention-days: 7
