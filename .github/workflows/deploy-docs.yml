name: Deploy

# External actions are pinned to full commit SHAs to prevent supply-chain
# attacks via tag reassignment. Run `gh api repos/OWNER/REPO/git/ref/tags/vN`
# to look up the current SHA when upgrading. Review SonarCloud hotspots
# (rule githubactions:S7637) periodically.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for GitHub Pages deploys
permissions:
  contents: read
  pages: write
  id-token: write

# Don't deploy concurrent runs — they will conflict on the Pages environment
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # spora-core is a sibling repo under the spora-ai GitHub org. Check it out
      # into ./spora-core so the deploy workflow can run bin/spora-build
      # openapi:generate against spora-core@main and emit docs/.vuepress/openapi.json
      # before `npm run build` runs (its prebuild hook calls gen:api, which reads
      # the spec from disk). Mirrors the api-spec job in ci-docs.yml so the
      # deploy workflow is self-contained — no committed binary blob, no drift.
      - name: Checkout spora-core
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: spora-ai/spora-core
          ref: main
          path: spora-core

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, zip
          coverage: none

      - name: Composer install (spora-core)
        working-directory: spora-core
        run: composer install --no-interaction --prefer-dist

      # `bin/spora-build` is spora-core's build-time companion to `bin/spora` —
      # a Symfony Console subcommand entry that skips the kernel boot, so a clean
      # checkout (no storage/secret.key, no installed app) can still emit the
      # spec. Requires spora-core PR #140 on main; that PR has been merged.
      - name: Generate openapi.json
        working-directory: spora-core
        run: php bin/spora-build openapi:generate "$GITHUB_WORKSPACE/docs/.vuepress/openapi.json"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/.vuepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
